# 无日期的基准行业/板块仅导出参考，不能作为历史已核验成员关系进入正式训练。

# 市场通道专项（M2/M4/M5/M6，见 docs/MARKET_CHANNEL.md）。默认不启用：未写此段时面板与旧版本完全一致。
# 启用后须用 main.py --new 新建准备版本；门槛必须在首次运行 E3 之前写定，null 门槛会阻断正式融合。
# market_channel:
#   news_routes: true                  # 是否使用新闻审核路由；false 时仅用官方宏观事件
#   evidence_basis: [source_text]      # 可选 source_text / title_only / unverified_summary；后两者只用于消融
#   official_events: null              # scripts/14_build_official_events.py 输出的 *_features 目录
#   event_dedup:
#     window_sessions: 1               # 同一事件的发布交易日最大间隔
#     cosine_threshold: 0.92           # FinBERT 向量余弦相似度阈值；须在人工抽检样本上确定
#   gates:
#     min_events: {train: null, valid: null, test: null}
#     min_active_days: {train: null, valid: null, test: null}
#     max_event_type_share: 0.5        # 单一事件类型占比上限；null 表示不检查
#   evaluation: null                   # M3 评估结果目录，仅记录在 manifest 中

# NASDAQ快速探索对照：历史摘要来源未完整核验，允许摘要证据仅用于探索性消融。
# 下面门槛是预先固定的试运行下限，不代表统计充分性或正式原文证据验收。
market_channel:
  news_routes: true
  evidence_basis: [source_text, title_only, unverified_summary]
  official_events: null
  event_dedup:
    window_sessions: 1
    cosine_threshold: 0.92
  gates:
    min_events: {train: 15, valid: 5, test: 3}
    min_active_days: {train: 30, valid: 10, test: 10}
    max_event_type_share: null  # 旧新闻缺已核验事件类型；报告unknown，不能声称已通过类型多样性验收。
  evaluation: null  # 尚缺人工精确率/召回评估；本轮不冒充已完成人工全审。

# 历史三通道离线验收：行业训练股票×日 NASDAQ=35、NYSE=5、SP500=0。
# SP500 缺同类别、同日期的已核验训练期成员；全通道 validate 继续阻断该市场。
# 不通过外推日期或降低 minimum_training_cells 制造覆盖。未在本轮启动正式训练。

# 本轮市场/行业阈值0.75均为模型自评门槛。引用、字典、数组轴和时间校验保留。
# reference_retrospective 不构成真实历史行业有效期证明；不能用于 observed_pit。
# SEC-SIC、TRSR-INDUSTRY、SP500-SECTOR不互猜代码；上游从各自字典选取，逐分类精确关联。
