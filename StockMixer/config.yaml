# Official StockMixer 复现实验配置
# 说明：
# 1. 本配置只替代原 train.py 顶部的硬编码超参数，便于复现实验调参。
# 2. 不改变原始模型结构、loss、训练循环、验证/测试流程和 best-val-loss 选择逻辑。
# 3. 默认使用 CUDA；如需 CPU，手动把 training.device 改为 cpu。
#
# NYSE 配置说明（手动修改下方对应字段；此处注释不会自动切换数据集）：
#   data.market_name: NYSE
#   data.stock_num: 1737
#   data.fea_num: 5
#   data.lookback_length: 16
#   data.steps: 1
#   data.valid_index: 756
#   data.test_index: 1008
#   model.market_num: 25
#   training.epochs: 100
#   training.learning_rate: 0.001
#   training.alpha: 0.1
#   training.selection_metric: val_loss
# 依据：论文表 1 和 Implementation Details 给出 NYSE 股票数、窗口、m=25、lr 和 alpha；
# epochs、随机种子、Adam 和 val_loss 选模方式沿用原始 src/train.py。
# 原始脚本的 market_num=20 是 NASDAQ 默认值，切换 NYSE 时应按论文改为 25。
# NYSE 原始数据源划分：训练 2013-01-02~2015-12-31（756 天），
# 验证 2016-01-04~2016-12-30（252 天），测试 2017-01-03~2017-12-08（237 天）。
# StockMixer 论文表 1 将测试天数写为 273，与原始数据源的 237 不一致；勿据此补齐数据。
# 当前训练保留原始窗口采样，lookback=16、steps=1 时训练目标可能进入验证期前 16 天。
# 运行前须准备 dataset/NYSE/ 下的 eod_data.pkl、mask_data.pkl、gt_data.pkl、price_data.pkl；
# NYSE 数据已用 scripts/prepare_nyse_data.py 和原始 load_EOD_data(steps=1) 生成并检查。
# 当前形状为 eod_data=(1737,1245,5)，其余三个数组=(1737,1245)；均为 float32。
# 特征为 5/10/20/30 日收盘均线及收盘价；股票/日期顺序见 NYSE/tickers.csv、trading_dates.csv。
# 完整校验、数据来源及文件哈希见 dataset/NYSE/validation_report.json。
# scale_factor=3、activation=GELU 保留原始配置标记；当前模型未使用 scale 参数，
# activation 也未接入模型构造，不能仅修改这两项就实现论文三尺度或统一切换激活函数。

data:
  # 数据集名称：NASDAQ / SP500 / NYSE
  # 官方原始 train.py 默认是 NASDAQ。
  market_name: NASDAQ

  # 数据集根目录。通常不需要修改。
  dataset_root: dataset

  # 股票数量。保持官方逻辑：模型结构依赖该值，不自动改写。
  # NASDAQ=1026；SP500=474；NYSE=1737，切换数据集时须同步修改。
  stock_num: 1026

  # 输入特征数量。官方数据为 5。
  fea_num: 5

  # 历史窗口长度，对应原 lookback_length。
  lookback_length: 16

  # 预测步长。steps=1 表示预测下一交易日收益。
  steps: 1

  # NASDAQ/NYSE：valid_index=756、test_index=1008；SP500 论文设置为 1006、1259。
  # 训练沿用官方采样：打乱起点 0..valid_index-1，
  # 每轮取前 valid_index-lookback_length-steps+1 个窗口，目标可能进入验证段。
  # valid_index <= target_idx < test_index 为验证段；
  # target_idx >= test_index 为测试段。
  valid_index: 756
  test_index: 1008

model:
  # 横截面股票混合隐藏维度，对应原 market_num。
  # 论文设置：NASDAQ=20；SP500=8；NYSE=25，切换数据集时须同步修改。
  market_num: 20

  # 多尺度时间混合 scale 参数，对应原 scale_factor。
  scale_factor: 3

  # 仅记录官方原始配置标记；模型代码中实际激活函数保持原样。
  activation: GELU

training:
  # 官方默认训练轮数。
  epochs: 100

  # Adam 学习率。官方原始代码无 weight_decay，这里也不加入。
  learning_rate: 0.001

  # ranking loss 系数。
  alpha: 0.1

  # 官方原始随机种子。
  numpy_seed: 123456789
  torch_seed: 12345678

  # 默认 cuda；若当前 PyTorch/CUDA 不可用会直接报错，便于发现环境问题。
  # 可选：cuda / cpu / auto
  device: cuda

  # 最优模型选择标准。只改变“记录哪个 epoch 为 best”的标准，不改变训练/验证/测试流程。
  # 严格复现官方代码请保持 val_loss。
  # 可选：
  #   val_loss      = 验证集总 loss 最小，官方原始逻辑
  #   val_mse_loss  = 验证集 MSE loss 分量最小
  #   val_rank_loss = 验证集 ranking loss 分量最小 X
  #   val_mse       = evaluator 中验证集 MSE 最小
  #   val_ic        = 验证集 IC 最大
  #   val_ric       = 验证集 RIC 最大
  #   val_prec_10   = 验证集 Prec@10 最大
  #   val_sharpe5   = 验证集 Sharpe@5 最大
  selection_metric: val_loss

output:
  # 是否保存 best_model.pt 和 last_model.pt。不影响训练逻辑。
  save_checkpoints: true

  # 是否保存 history.csv。不影响训练逻辑。
  save_history: true

  # 是否尝试绘制 figures。不影响训练逻辑；matplotlib 不可用时自动跳过。
  save_figures: true
